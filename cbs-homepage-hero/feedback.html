<!-- feedback-layer:start -->
<style id="fb-style">
#fb-layer{position:absolute;top:0;left:0;width:0;height:0;z-index:2000;}
#fb-layer .fb-pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;padding:0;border:1px solid #fff;border-radius:0;background:#009BDB;color:#fff;font:600 13px/26px neue-haas-grotesk-display,"Helvetica Neue",Arial,sans-serif;text-align:center;cursor:pointer;box-shadow:0 0 0 1px #181a1c;}
#fb-layer .fb-pin:hover,#fb-layer .fb-pin.is-open{background:#181a1c;}
#fb-layer .fb-pin.is-closed{background:#fff;color:#687078;box-shadow:0 0 0 1px #D2D9E1;}
#fb-layer .fb-pin.is-closed:hover,#fb-layer .fb-pin.is-closed.is-open{background:#fff;color:#181a1c;box-shadow:0 0 0 1px #181a1c;}
#fb-layer .fb-pin.is-draft{background:#181a1c;}
.fb-mark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;padding:0;border:1px solid #009BDB;border-radius:0;background:#fff;color:#009BDB;font:600 12px/20px neue-haas-grotesk-display,"Helvetica Neue",Arial,sans-serif;text-align:center;cursor:pointer;}
#fb-layer .fb-mark:hover,#fb-layer .fb-mark.is-open{background:#009BDB;color:#fff;border-color:#009BDB;}
.fb-orig{font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;margin:0 0 20px;padding:0 0 16px;border-bottom:1px solid #E3E8EE;color:#687078;}
#fb-shield{position:absolute;z-index:1999;cursor:crosshair;background:transparent;}
#fb-hover{position:absolute;z-index:1998;pointer-events:none;outline:1px solid #009BDB;outline-offset:-1px;display:none;}
.fb-ui,.fb-ui *{box-sizing:border-box;font-family:neue-haas-grotesk-display,"Helvetica Neue",Arial,sans-serif;color:#181a1c;border-radius:0;}
.fb-ui button{cursor:pointer;font-size:14px;font-weight:600;line-height:1;padding:12px 18px;border:1px solid #181a1c;background:#fff;color:#181a1c;}
.fb-ui button:hover{border-color:#009BDB;color:#009BDB;}
.fb-ui button.fb-primary{background:#181a1c;color:#fff;}
.fb-ui button.fb-primary:hover{background:#009BDB;border-color:#009BDB;color:#fff;}
.fb-ui button.fb-link{border:0;padding:6px 0;background:none;color:#687078;font-weight:400;font-size:13px;}
.fb-ui button.fb-link:hover{color:#009BDB;}
.fb-ui button[disabled]{opacity:.5;cursor:default;}
#fb-dock{position:fixed;right:24px;bottom:24px;z-index:2004;display:flex;flex-direction:column;align-items:flex-end;background:none;border:0;}
#fb-tools{position:absolute;right:0;bottom:calc(100% + 8px);display:flex;flex-direction:column;align-items:stretch;gap:8px;width:max-content;pointer-events:none;}
#fb-tools button{min-width:100%;text-align:left;white-space:nowrap;border:1px solid #D2D9E1;background:#fff;padding:14px 20px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;}
#fb-tools button:hover{border-color:#009BDB;}
#fb-tools button[disabled]:hover{border-color:#D2D9E1;color:#181a1c;}
#fb-dock.is-open #fb-tools button[disabled]{opacity:.45;}
body.fb-hidden #fb-layer,body.fb-hidden .fb-pop,body.fb-hidden #fb-list,body.fb-hidden #fb-hover,body.fb-hidden #fb-shield,body.fb-hidden #fb-hint{display:none !important;}
#fb-tools button[aria-pressed=true]{background:#181a1c;color:#fff;}
#fb-dock.is-open #fb-tools{pointer-events:auto;}
#fb-dock.is-open #fb-tools button{opacity:1;transform:translateY(0);pointer-events:auto;}
#fb-dock.is-open #fb-tools button[disabled]{pointer-events:auto;}
#fb-tools #fb-hide{transition-delay:0ms;}
#fb-tools #fb-open-list{transition-delay:45ms;}
#fb-tools #fb-edit{transition-delay:90ms;}
#fb-tools #fb-toggle{transition-delay:135ms;}
#fb-dock:not(.is-open) #fb-tools #fb-toggle{transition-delay:0ms;}
#fb-dock:not(.is-open) #fb-tools #fb-edit{transition-delay:45ms;}
#fb-dock:not(.is-open) #fb-tools #fb-open-list{transition-delay:90ms;}
#fb-dock:not(.is-open) #fb-tools #fb-hide{transition-delay:135ms;}
#fb-tools-btn{width:48px;height:48px;min-width:48px;padding:0;border:0;border-radius:50%;background:#1a3a5c;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#fb-tools-btn,#fb-tools-btn *{color:#fff;border-radius:50%;}
#fb-tools-btn:hover,#fb-tools-btn:focus{background:#1a3a5c;border:0;color:#fff;}
#fb-tools-btn:focus-visible{outline:2px solid #009BDB;outline-offset:2px;}
#fb-tools-btn .fb-tools-icons{position:relative;display:block;width:20px;height:20px;border-radius:0;}
#fb-tools-btn .fb-tools-icon{position:absolute;top:0;left:0;display:block;border-radius:0;transition:opacity 180ms ease,transform 180ms ease;}
#fb-tools-btn .fb-tools-icon,#fb-tools-btn .fb-tools-icon *{border-radius:0;}
#fb-tools-btn .fb-tools-icon-dash{opacity:1;transform:none;}
#fb-tools-btn .fb-tools-icon-close{opacity:0;transform:rotate(-45deg);}
#fb-dock.is-open #fb-tools-btn .fb-tools-icon-dash{opacity:0;transform:scale(.85);}
#fb-dock.is-open #fb-tools-btn .fb-tools-icon-close{opacity:1;transform:rotate(0);}
@media (prefers-reduced-motion:reduce){
#fb-tools button,#fb-tools-btn .fb-tools-icon{transition:none;}
}
#fb-hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2002;background:#fff;border:1px solid #D2D9E1;padding:14px 20px;font-size:14px;display:none;}
.fb-pop{position:absolute;z-index:2001;width:340px;max-width:calc(100vw - 32px);background:#fff;border:1px solid #D2D9E1;padding:24px;box-shadow:0 8px 24px rgba(24,26,28,.08);}
.fb-pop label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:#687078;margin:0 0 6px;}
.fb-pop input,.fb-pop textarea{display:block;width:100%;margin:0 0 16px;padding:10px 12px;border:1px solid #D2D9E1;background:#fff;font-size:15px;line-height:1.4;}
.fb-pop input:focus,.fb-pop textarea:focus{outline:0;border-color:#009BDB;}
.fb-pop textarea{min-height:96px;resize:vertical;}
.fb-actions{display:flex;gap:8px;align-items:center;}
.fb-actions .fb-spacer{flex:1;}
.fb-msg{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid #E3E8EE;}
.fb-msg:last-of-type{margin-bottom:20px;}
.fb-meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#687078;margin:0 0 6px;}
.fb-meta strong{color:#181a1c;font-weight:600;}
.fb-text{font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;margin:0;}
.fb-reply{margin-left:16px;padding-left:16px;border-left:1px solid #E3E8EE;}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 16px;font-size:13px;color:#687078;}
.fb-head strong{font-size:15px;color:#181a1c;}
.fb-err{color:#b3261e;font-size:13px;margin:0 0 12px;}
#fb-list{position:fixed;top:0;right:0;bottom:0;z-index:2005;width:380px;max-width:100vw;background:#fff;border-left:1px solid #D2D9E1;padding:32px 28px;overflow-y:auto;display:none;}
#fb-list h2{font-size:18px;font-weight:700;margin:0 0 4px;}
#fb-list .fb-sub{font-size:13px;color:#687078;margin:0 0 24px;}
#fb-list ol{list-style:none;margin:0;padding:0;border-top:1px solid #E3E8EE;}
#fb-list li button{display:grid;grid-template-columns:36px 1fr;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid #E3E8EE;padding:16px 0;background:none;font-weight:400;}
#fb-list li button:hover .fb-n{background:#181a1c;}
#fb-list .fb-n{width:28px;height:28px;background:#009BDB;color:#fff;text-align:center;line-height:28px;font-size:13px;font-weight:600;}
#fb-list .fb-ex{font-size:14px;line-height:1.4;}
#fb-list .fb-ex small{display:block;color:#687078;font-size:12px;margin-top:4px;}
.fb-status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid #E3E8EE;font-size:13px;color:#687078;}
.fb-status strong{color:#181a1c;font-weight:600;}
.fb-status.is-closed strong{color:#687078;}
.fb-status button{padding:10px 14px;font-size:13px;}
#fb-list .fb-n.is-closed{background:#fff;color:#687078;box-shadow:inset 0 0 0 1px #D2D9E1;}
#fb-list li.is-closed .fb-ex{color:#687078;}
#fb-list h3{font-size:13px;font-weight:600;letter-spacing:.02em;color:#687078;margin:32px 0 0;padding:0 0 10px;}
#fb-list .fb-tr{grid-template-columns:36px 1fr auto;align-items:center;padding:12px 0;}
#fb-list .fb-tr .fb-st{font-size:12px;color:#687078;}
#fb-list .fb-sub+h3{margin-top:8px;}
#fb-list .fb-empty{font-size:13px;color:#687078;padding:12px 0;margin:0;border-bottom:1px solid #E3E8EE;}
#fb-list .fb-close{position:absolute;top:24px;right:24px;}
</style>

<script>
(function(){
  var API=(/(^|\.)cbs-homepage-hero\.pages\.dev$/.test(location.hostname)?'':'https://cbs-homepage-hero.pages.dev')+'/api/comments';
  var stage=document.getElementById('stage'),layer=document.getElementById('fb-layer'),hover=document.getElementById('fb-hover'),
      hint=document.getElementById('fb-hint'),toggle=document.getElementById('fb-toggle'),listBtn=document.getElementById('fb-open-list'),
      list=document.getElementById('fb-list'),editBtn=document.getElementById('fb-edit');
  var EAPI=API.replace(/\/comments$/,'/edits'),edits=[],editing=false,eOpenId=null,eDraft=null,eSeq=0;

  function curTab(){var m=(location.hash||'').match(/^#(tab-\d+)$/);if(m)return m[1];var s=document.querySelector('[role=tab][aria-selected=true]');return 'tab-'+(s?s.dataset.n:'1');}

  }
  // Anchor = child-index path from #stage to the clicked element.
  function pathOf(node){var p=[];while(node&&node!==stage){var par=node.parentElement;if(!par)return '';p.unshift([].indexOf.call(par.children,node));node=par;}return node===stage?p.join('/'):'';}

  }
  function rectOf(node){var r=node.getBoundingClientRect();if(!r.width&&!r.height){r=stage.getBoundingClientRect();}return {l:r.left+scrollX,t:r.top+scrollY,w:r.width||1,h:r.height||1};}
  function pagePos(p){var r=rectOf(resolve(p.anchor));return {x:r.l+r.w*p.x/100,y:r.t+r.h*p.y/100};}
  function render(){
    layer.innerHTML='';
    pins.forEach(function(p){
      if(isClosed(p))return;
      var pos=pagePos(p),b=el('button',{type:'button','class':'fb-pin'+(openId===p.id?' is-open':''),'aria-label':'Comment '+p.n},String(p.n));
      b.style.left=pos.x+'px';b.style.top=pos.y+'px';
      b.addEventListener('click',function(e){e.stopPropagation();openThread(p.id);});
      layer.appendChild(b);
    });
    edits.forEach(function(ed){
      var node=resolve(ed.anchor);if(node===stage)return;var r=rectOf(node);
      var m=el('button',{type:'button','class':'fb-mark'+(eOpenId===ed.id?' is-open':''),'aria-label':'Copy revision '+ed.n},String(ed.n));
      m.style.left=(r.l+r.w)+'px';m.style.top=r.t+'px';
      m.addEventListener('click',function(e){e.stopPropagation();openEdit(ed.id);});
      layer.appendChild(m);
    });
    if(draft){var pos=pagePos(draft),d=el('div',{'class':'fb-pin is-draft'},'+');d.style.left=pos.x+'px';d.style.top=pos.y+'px';layer.appendChild(d);}
    listBtn.textContent='Comments ('+pins.length+')';
    if(pop)placePop();
    if(list.style.display==='block')renderList();
    if(shield)sizeShield();
  }
  function load(){
    var seq=++loadSeq,t=tab;
    return req('GET','?tab='+encodeURIComponent(t)).then(function(d){if(seq!==loadSeq||t!==tab)return;pins=d.pins||[];render();if(openId)openThread(openId,true);})
      .catch(function(e){if(seq===loadSeq){listBtn.textContent='Comments (offline)';}});
  }
  function closePop(){if(pop){pop.remove();pop=null;}openId=null;draft=null;eOpenId=null;eDraft=null;render();}
  function placePop(){
    var pos;
    if(eOpenId||eDraft){var ed=eDraft||edits.filter(function(x){return x.id===eOpenId;})[0];if(!ed||!pop)return;var r=rectOf(eDraft?eDraft.node:resolve(ed.anchor));pos={x:r.l+r.w,y:r.t};}
    else{var anchor=openId?pins.filter(function(p){return p.id===openId;})[0]:draft;if(!anchor||!pop)return;pos=pagePos(anchor);}

  function field(parent,label,tag,value,ph,max){var id='fb-'+Math.random().toString(36).slice(2);parent.appendChild(el('label',{'for':id},label));var f=el(tag,{id:id,maxlength:String(max||(tag==='input'?60:2000))});if(ph)f.placeholder=ph;f.value=value||'';parent.appendChild(f);return f;}

    openId=null;var p=newPop();
    p.appendChild(el('div',{'class':'fb-head'})).appendChild(el('strong',null,'New comment'));

    var showErr=errBox(p),a=p.appendChild(el('div',{'class':'fb-actions'}));

    save.onclick=function(){

      save.disabled=true;setName(name);
      req('POST','',{tab:tab,anchor:draft.anchor,x:draft.x,y:draft.y,label:draft.label,name:name,text:text}).then(function(d){
        draft=null;pins.push(d.pin);openId=null;if(pop){pop.remove();pop=null;}render();openThread(d.pin.id);

    render();(n.value?t:n).focus();
  }
  function msg(parent,m,cls,onDelete){
    var w=parent.appendChild(el('div',{'class':'fb-msg'+(cls?' '+cls:'')})),meta=w.appendChild(el('div',{'class':'fb-meta'}));
    meta.appendChild(el('strong',null,m.name));meta.appendChild(el('span',null,fmt(m.created)));

  }
  function openThread(id,refresh){

    sl.appendChild(el('strong',null,isClosed(pin)?'Closed':'Open'));
    if(isClosed(pin)&&pin.closedBy)sl.appendChild(document.createTextNode(' · '+pin.closedBy+(pin.closedAt?', '+fmt(pin.closedAt):'')));
    var sb=st.appendChild(el('button',{type:'button'},isClosed(pin)?'Reopen':'Mark as complete'));
    sb.onclick=function(){sb.disabled=true;req('POST','/'+pin.id+'/status',{tab:tab,name:getName()||'Reviewer',status:isClosed(pin)?'open':'closed'}).then(function(d){replacePin(d.pin);if(isClosed(d.pin))closePop();else openThread(pin.id);}).catch(function(e){sb.disabled=false;alert(e.message);});};
    msg(p,pin,'',function(){if(!confirm('Delete this comment and its replies?'))return;req('DELETE','/'+pin.id+'?tab='+encodeURIComponent(tab)).then(function(){pins=pins.filter(function(x){return x.id!==pin.id;});closePop();}).catch(function(e){alert(e.message);});});

    var n=field(p,'Name','input',getName()),t=field(p,'Reply','textarea',keepText);
    var showErr=errBox(p),a=p.appendChild(el('div',{'class':'fb-actions'}));
    var rb=a.appendChild(el('button',{type:'button','class':'fb-primary'},'Reply'));a.appendChild(el('span',{'class':'fb-spacer'}));

    rb.onclick=function(){
      var name=n.value.trim(),text=t.value.trim();if(!name){showErr('Add your name.');n.focus();return;}if(!text){showErr('Add a reply.');t.focus();return;}
      rb.disabled=true;setName(name);
      req('POST','/'+pin.id+'/replies',{tab:tab,name:name,text:text}).then(function(d){replacePin(d.pin);openThread(pin.id);}).catch(function(e){rb.disabled=false;showErr(e.message);});
    };

  }
  // ---- Edit copy ----
  var TEXT_BLOCK='h1,h2,h3,h4,h5,h6,p,a,button,li,figcaption,blockquote,label,dt,dd,td,th,legend,summary';
  var NON_TEXT='img,svg,iframe,video,picture,canvas,input,textarea,select,object,embed';
  function isDeco(n){return n.nodeType===1&&(n.getAttribute('aria-hidden')==='true'||n.tagName==='svg'||n.tagName==='SVG');}

  function textOnly(node){
    var bad=[].slice.call(node.querySelectorAll(NON_TEXT)).filter(function(x){return !x.closest('[aria-hidden=true]');});

  // Replace the visible copy of node with text, keeping decorative (aria-hidden) children such as arrows.

  }
  function latest(ed){var r=ed.revisions||[];return r.length?r[r.length-1].text:ed.original;}
  var applied=[];

  }
  function loadEdits(){
    var seq=++eSeq,t=tab;
    return req('GET','?tab='+encodeURIComponent(t),null,EAPI).then(function(d){if(seq!==eSeq||t!==tab)return;edits=d.edits||[];applyEdits();render();if(eOpenId&&(!pop||!pop.contains(document.activeElement)))openEdit(eOpenId);}).catch(function(){});
  }
  function replaceEdit(ed,id){edits=edits.filter(function(x){return x.id!==(ed?ed.id:id);});if(ed)edits.push(ed);edits.sort(function(a,b){return a.n-b.n;});applyEdits();}
  function editForm(p,current,onSave,secondary){
    var t=field(p,'Revision','textarea',current,null,4000),n=field(p,'Name','input',getName());
    var showErr=errBox(p),a=p.appendChild(el('div',{'class':'fb-actions'}));
    var save=a.appendChild(el('button',{type:'button','class':'fb-primary'},'Save'));a.appendChild(el('span',{'class':'fb-spacer'}));
    var c=a.appendChild(el('button',{type:'button'},secondary));c.onclick=closePop;
    save.onclick=function(){
      var name=n.value.trim(),text=t.value.trim();if(!text){showErr('Add a revision.');t.focus();return;}
      if(norm(text)===norm(current)){showErr('Change the copy before saving.');t.focus();return;}
      if(!name){showErr('Add your name.');n.focus();return;}
      save.disabled=true;setName(name);onSave(name,text).catch(function(e){save.disabled=false;showErr(e.message);});
    };
    t.focus({preventScroll:true});t.select();
  }
  function openEditDraft(node){
    var anchor=pathOf(node);if(!anchor)return;
    var ex=edits.filter(function(x){return x.anchor===anchor;})[0];if(ex){openEdit(ex.id);return;}
    openId=null;draft=null;eOpenId=null;var original=norm(copyOf(node));eDraft={node:node};
    var p=newPop();p.setAttribute('aria-label','Edit copy');
    p.appendChild(el('label',null,'Original'));p.appendChild(el('p',{'class':'fb-orig'},original));

      return req('POST','',{tab:tab,anchor:anchor,original:original,name:name,text:text},EAPI).then(function(d){
        eDraft=null;replaceEdit(d.edit);if(pop){pop.remove();pop=null;}render();openEdit(d.edit.id);});
    },'Cancel');
    render();
  }
  function openEdit(id){
    var ed=edits.filter(function(x){return x.id===id;})[0];if(!ed){closePop();return;}

      msg(p,r,'',function(){req('DELETE','/'+ed.id+'/revisions/'+r.id+'?tab='+encodeURIComponent(tab),null,EAPI).then(function(d){replaceEdit(d.edit,ed.id);if(d.edit)openEdit(ed.id);else closePop();}).catch(function(e){alert(e.message);});});
    });

  var eShield=null;
  function setEditing(on){
    editing=on;editBtn.setAttribute('aria-pressed',on?'true':'false');editBtn.textContent=on?'Done':'Edit copy';
    hint.textContent=on?'Click any highlighted copy to suggest a revision.':'Click anywhere on the page to drop a pin.';hint.style.display=on?'block':'none';
    if(on){eShield=el('div',{id:'fb-shield'});document.body.appendChild(eShield);shield=eShield;sizeShield();
      var cur=null;
      eShield.addEventListener('mousemove',function(e){var t=editTarget(under(e));cur=t;if(!t){hover.style.display='none';eShield.style.cursor='default';return;}eShield.style.cursor='text';var r=rectOf(t);hover.style.display='block';hover.style.left=r.l+'px';hover.style.top=r.t+'px';hover.style.width=r.w+'px';hover.style.height=r.h+'px';});
      eShield.addEventListener('mouseleave',function(){hover.style.display='none';});
      eShield.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var t=editTarget(under(e));if(!t)return;setEditing(false);openEditDraft(t);});
    }else{if(eShield){eShield.remove();if(shield===eShield)shield=null;eShield=null;}hover.style.display='none';}
  }
  editBtn.addEventListener('click',function(){if(placing)setPlacing(false);if(!editing)closePop();setEditing(!editing);});
  function isClosed(p){return p.status==='closed';}
  function replacePin(np){pins=pins.map(function(x){return x.id===np.id?np:x;});}
  function renderList(){
    list.innerHTML='';var c=list.appendChild(el('button',{type:'button','class':'fb-close'},'Done'));c.onclick=function(){list.style.display='none';};
    list.appendChild(el('h2',null,'Comments'));list.appendChild(el('p',{'class':'fb-sub'},tabLabel()+' · '+pins.length+(pins.length===1?' comment':' comments')));
    [['Open',pins.filter(function(p){return !isClosed(p);})],['Closed',pins.filter(isClosed)]].forEach(function(g){
      list.appendChild(el('h3',null,g[0]+' ('+g[1].length+')'));
      var gl=list.appendChild(el('ol'));
      if(!g[1].length){list.appendChild(el('p',{'class':'fb-empty'},g[0]==='Open'?'No open items.':'No closed items.'));return;}
      g[1].forEach(function(p){
        var li=gl.appendChild(el('li',isClosed(p)?{'class':'is-closed'}:null)),b=li.appendChild(el('button',{type:'button','class':'fb-tr'}));
        b.appendChild(el('span',{'class':'fb-n'+(isClosed(p)?' is-closed':'')},String(p.n)));
        b.appendChild(el('span',{'class':'fb-ex'},p.text.length>60?p.text.slice(0,60)+'…':p.text));
        b.appendChild(el('span',{'class':'fb-st'},g[0]));
        b.onclick=function(){jump(p);};
      });
    });
    if(edits.length){
      list.appendChild(el('h3',null,'Copy revisions ('+edits.length+')'));
      var el2=list.appendChild(el('ol'));
      edits.forEach(function(ed){
        var b=el2.appendChild(el('li')).appendChild(el('button',{type:'button','class':'fb-tr'}));
        var nn=b.appendChild(el('span',{'class':'fb-n is-closed'},String(ed.n)));nn.style.color='#009BDB';nn.style.boxShadow='inset 0 0 0 1px #009BDB';
        var lt=latest(ed);b.appendChild(el('span',{'class':'fb-ex'},lt.length>60?lt.slice(0,60)+'…':lt));
        b.appendChild(el('span',{'class':'fb-st'},'Revision'));
        b.onclick=function(){if(innerWidth<900)list.style.display='none';var r=rectOf(resolve(ed.anchor));scrollTo({top:Math.max(0,r.t-160),behavior:'smooth'});openEdit(ed.id);};
      });
    }
  }
  function jump(p){if(innerWidth<900)list.style.display='none';var pos=pagePos(p);scrollTo({top:Math.max(0,pos.y-160),behavior:'smooth'});openThread(p.id);}
  // Placing mode: a transparent shield over the stage catches clicks (including over video iframes).
  function sizeShield(){var r=stage.getBoundingClientRect();shield.style.left=(r.left+scrollX)+'px';shield.style.top=(r.top+scrollY)+'px';shield.style.width=r.width+'px';shield.style.height=Math.max(r.height,1)+'px';}
  function under(e){shield.style.pointerEvents='none';var t=document.elementFromPoint(e.clientX,e.clientY);shield.style.pointerEvents='auto';return t&&stage.contains(t)&&t!==stage?t:stage;}
  function setPlacing(on){
    if(on&&editing)setEditing(false);
    placing=on;toggle.setAttribute('aria-pressed',on?'true':'false');toggle.textContent=on?'Done':'Leave feedback';hint.textContent='Click anywhere on the page to drop a pin.';hint.style.display=on?'block':'none';
    if(on){shield=el('div',{id:'fb-shield'});document.body.appendChild(shield);sizeShield();
      shield.addEventListener('mousemove',function(e){var t=under(e),r=rectOf(t);hover.style.display='block';hover.style.left=r.l+'px';hover.style.top=r.t+'px';hover.style.width=r.w+'px';hover.style.height=r.h+'px';});
      shield.addEventListener('mouseleave',function(){hover.style.display='none';});
      shield.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var t=under(e),r=rectOf(t),px=e.pageX,py=e.pageY;
        draft={anchor:pathOf(t),x:Math.round((px-r.l)/r.w*10000)/100,y:Math.round((py-r.t)/r.h*10000)/100,label:labelOf(t)};
        draft.x=Math.min(100,Math.max(0,draft.x));draft.y=Math.min(100,Math.max(0,draft.y));setPlacing(false);openDraft();});
    }else{if(shield){shield.remove();shield=null;}hover.style.display='none';}
  }
  var hideBtn=document.getElementById('fb-hide');
  var dock=document.getElementById('fb-dock'),tools=document.getElementById('fb-tools'),toolsBtn=document.getElementById('fb-tools-btn');
  function setToolsOpen(on){

    toolsBtn.setAttribute('aria-expanded',on?'true':'false');
    toolsBtn.setAttribute('aria-label',on?'Close review tools':'Open review tools');
    tools.setAttribute('aria-hidden',on?'false':'true');
    [toggle,editBtn,listBtn,hideBtn].forEach(function(b){b.tabIndex=on?0:-1;});
  }
  toolsBtn.addEventListener('click',function(){setToolsOpen(!dock.classList.contains('is-open'));});
  function setHidden(on){
    if(on){if(placing)setPlacing(false);if(editing)setEditing(false);closePop();list.style.display='none';}
    document.body.classList.toggle('fb-hidden',on);hideBtn.textContent=on?'Show feedback':'Hide feedback';hideBtn.setAttribute('aria-pressed',on?'true':'false');

  }
  hideBtn.addEventListener('click',function(){setHidden(!document.body.classList.contains('fb-hidden'));});
  toggle.addEventListener('click',function(){if(!placing){closePop();}setPlacing(!placing);});
  listBtn.addEventListener('click',function(){if(list.style.display==='block'){list.style.display='none';}else{list.style.display='block';renderList();}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(editing)setEditing(false);else if(placing)setPlacing(false);else if(pop)closePop();else list.style.display='none';}});
  document.addEventListener('click',function(e){if(!pop)return;var path=(e.composedPath&&e.composedPath())||[];function hold(n){return n&&(n===pop||n.id==='fb-list'||n.id==='fb-dock'||(n.classList&&(n.classList.contains('fb-pin')||n.classList.contains('fb-mark')||n.classList.contains('fb-pop'))));}if(path.some(hold)||(e.target.closest&&e.target.closest('.fb-pin,.fb-mark,.fb-pop,#fb-dock,#fb-list')))return;closePop();});
  function onTab(){var t=curTab();if(t===tab)return;tab=t;pins=[];edits=[];applied=[];if(pop){pop.remove();pop=null;}openId=null;draft=null;eOpenId=null;eDraft=null;if(placing)setPlacing(false);if(editing)setEditing(false);render();load();loadEdits();}
  new MutationObserver(function(){setTimeout(function(){applied=[];onTab();applyEdits();render();},0);}).observe(stage,{childList:true});
  var raf=0;function later(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render();});}
